<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Virtual Anime Museum</title>
  <meta name="description" content="A first-person museum you can walk into: exhibitions you enter as worlds.">
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="./src/ui/hud.css">
  <style>
    :root {
      --sans: "Segoe UI", "Helvetica Neue", Helvetica, Arial, sans-serif;
      --serif: Georgia, "Times New Roman", serif;
      --accent: #9fe8ff;
      /* The crosshair and prompt, in the museum's cool light (see src/ui/hud.css) */
      --hud-light: 236, 246, 255;
      --hud-accent: 159, 232, 255;
      --hud-glow: 159, 232, 255;
      --hud-font: var(--sans);
      /* How high the first-person hands reach up the screen (their lens has a fixed angle) */
      --hands-top: 23vh;
    }
    body { margin: 0; overflow: hidden; background: #000; color: #eef6ff; font-family: var(--sans); }
    canvas { display: block; }
    #interaction-prompt { font-style: normal; font-size: 13px; letter-spacing: 0.08em; }

    /* ---- Entering, and pausing: the museum's front door ---- */
    #entrance {
      position: fixed;
      inset: 0;
      z-index: 10;
      display: grid;
      place-items: center;
      text-align: center;
      background: radial-gradient(ellipse at 50% 45%, rgba(8, 14, 26, 0.5), rgba(2, 3, 6, 0.9) 72%);
      -webkit-backdrop-filter: blur(6px);
      backdrop-filter: blur(6px);
      transition: opacity 0.9s ease, visibility 0.9s, background 1.2s ease;
    }
    body:not(.ready) #entrance { background: #000; }
    body.locked #entrance { opacity: 0; visibility: hidden; }
    .entrance-inner { display: flex; flex-direction: column; align-items: center; gap: 16px; padding: 24px; max-width: 680px; }
    .entrance-rule { width: 72px; height: 1px; background: linear-gradient(90deg, transparent, var(--accent), transparent); }
    .entrance-kicker { margin: 0; font-size: 11px; letter-spacing: 0.5em; padding-left: 0.5em; text-transform: uppercase; color: rgba(159, 232, 255, 0.8); }
    .entrance-title {
      margin: 0;
      font-weight: 200;
      font-size: clamp(24px, 4.2vw, 46px);
      letter-spacing: 0.32em;
      padding-left: 0.32em;
      text-transform: uppercase;
      text-shadow: 0 0 40px rgba(159, 232, 255, 0.25);
    }
    .entrance-tagline { margin: 0; font-family: var(--serif); font-style: italic; font-size: 17px; color: rgba(220, 232, 245, 0.75); }
    .entrance-action {
      margin-top: 18px;
      padding: 12px 30px;
      border: 1px solid rgba(159, 232, 255, 0.45);
      border-radius: 999px;
      font-size: 12px;
      letter-spacing: 0.32em;
      padding-left: calc(30px + 0.32em);
      text-transform: uppercase;
      color: #eaf8ff;
      box-shadow: inset 0 0 24px rgba(159, 232, 255, 0.12), 0 0 32px rgba(159, 232, 255, 0.1);
      animation: breathe 3.6s ease-in-out infinite;
    }
    @keyframes breathe { 50% { box-shadow: inset 0 0 24px rgba(159, 232, 255, 0.2), 0 0 44px rgba(159, 232, 255, 0.18); } }
    body:not(.ready) .entrance-action { border-color: transparent; box-shadow: none; animation: none; color: rgba(200, 215, 230, 0.6); }
    .entrance-controls { margin: 6px 0 0; font-size: 10.5px; letter-spacing: 0.2em; line-height: 2; text-transform: uppercase; color: rgba(200, 215, 230, 0.5); }
    .entrance-controls b { font-weight: 600; color: rgba(225, 238, 250, 0.75); }
    .settings { display: flex; align-items: center; gap: 12px; font-size: 10.5px; letter-spacing: 0.24em; text-transform: uppercase; color: rgba(200, 215, 230, 0.55); }
    #volume-slider { width: 120px; accent-color: var(--accent); }
    .entrance-note { margin: 0; font-family: var(--serif); font-style: italic; font-size: 13px; color: rgba(200, 215, 230, 0.4); }
    /* Which words show: opening, ready to enter, or paused */
    .when-ready, .when-paused { display: none; }
    body.ready .when-loading { display: none; }
    body.ready:not(.paused) .when-ready { display: inline; }
    body.paused .when-paused { display: inline; }
    body.paused .when-unpaused { display: none; }

    /* ---- A line of narration, bottom left, above the left hand ---- */
    #story {
      position: absolute;
      left: 28px;
      bottom: max(28px, var(--hands-top));
      max-width: min(440px, calc(100vw - 56px));
      padding: 13px 20px 14px 18px;
      border-left: 1px solid rgba(159, 232, 255, 0.7);
      border-radius: 1px 8px 8px 1px;
      background: linear-gradient(90deg, rgba(6, 10, 18, 0.62), rgba(6, 10, 18, 0.25));
      -webkit-backdrop-filter: blur(6px);
      backdrop-filter: blur(6px);
      color: rgba(240, 247, 255, 0.95);
      font-family: var(--serif);
      font-size: 17px;
      font-style: italic;
      line-height: 1.55;
      text-shadow: 0 1px 6px rgba(0, 0, 0, 0.6);
      pointer-events: none;
      opacity: 0;
      transform: translateY(14px);
      filter: blur(2px);
      transition: opacity 0.9s ease, transform 1.1s cubic-bezier(0.22, 1, 0.36, 1), filter 0.9s ease;
    }
    #story.visible { opacity: 1; transform: translateY(0); filter: blur(0); }

    /* ---- The placard beside an exhibit: glass, fine type, a line to the thing itself ---- */
    #placard { position: fixed; inset: 0; z-index: 5; pointer-events: none; --placard-accent: #9fe8ff; }
    .placard-panel {
      position: absolute;
      left: 0;
      top: 0;
      width: min(340px, 38vw);
      max-height: calc(100vh - 48px);
      overflow: hidden;
      box-sizing: border-box;
      padding: 20px 22px 18px;
      background: linear-gradient(160deg, rgba(16, 22, 34, 0.74), rgba(7, 10, 17, 0.62));
      -webkit-backdrop-filter: blur(14px) saturate(1.2);
      backdrop-filter: blur(14px) saturate(1.2);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 3px;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.45), inset 0 1px 0 rgba(255, 255, 255, 0.05);
      opacity: 0;
      visibility: hidden;
      filter: blur(3px);
      transition: opacity 0.45s ease, visibility 0.45s, filter 0.45s ease;
    }
    .placard-panel::before {
      content: '';
      position: absolute;
      left: 22px;
      top: -1px;
      width: 48px;
      height: 2px;
      background: var(--placard-accent);
      box-shadow: 0 0 12px var(--placard-accent);
    }
    #placard.open .placard-panel { opacity: 1; visibility: visible; filter: blur(0); }
    .placard-label { margin: 0 0 10px; font-size: 10px; letter-spacing: 0.3em; text-transform: uppercase; color: var(--placard-accent); }
    .placard-title { margin: 0; font-weight: 300; font-size: 24px; line-height: 1.2; letter-spacing: 0.02em; color: #f4f9ff; }
    .placard-meta { margin: 6px 0 0; font-family: var(--serif); font-style: italic; font-size: 13px; color: rgba(200, 215, 230, 0.7); }
    .placard-body {
      margin-top: 14px;
      padding-top: 14px;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      font-family: var(--serif);
      font-size: 14.5px;
      line-height: 1.6;
      color: rgba(230, 238, 246, 0.9);
    }
    .placard-body p { margin: 0 0 9px; }
    .placard-entries { list-style: none; margin: 8px 0 0; padding: 0; font-family: var(--serif); font-size: 13px; line-height: 1.45; color: rgba(220, 230, 240, 0.82); }
    .placard-entries li { margin-bottom: 5px; }
    .placard-entries strong { font-family: var(--sans); font-weight: 600; font-size: 11px; letter-spacing: 0.06em; color: #f0f7ff; }
    .placard-entries em { font-style: italic; color: rgba(200, 215, 230, 0.55); }
    /* Something the visitor can be taken to: its number, pressed, goes there (dashed: in another place) */
    .placard-link { white-space: nowrap; }
    .placard-more { font-style: italic; color: rgba(200, 215, 230, 0.5); }
    .placard-link kbd {
      display: inline-block;
      min-width: 15px;
      margin: 0 5px 0 1px;
      padding: 0 3px;
      box-sizing: border-box;
      border: 1px solid var(--placard-accent);
      border-radius: 3px;
      font: 600 10px/14px var(--sans);
      color: var(--placard-accent);
      text-align: center;
      vertical-align: 1px;
    }
    .placard-link.travel kbd { border-style: dashed; }
    .placard-footer { margin: 12px 0 0; font-size: 10px; letter-spacing: 0.24em; text-transform: uppercase; color: rgba(190, 205, 220, 0.45); }
    .placard-line {
      position: absolute;
      left: 0;
      top: 0;
      height: 1px;
      transform-origin: 0 50%;
      background: linear-gradient(90deg, var(--placard-accent), rgba(255, 255, 255, 0.12));
      opacity: 0;
      transition: opacity 0.45s ease;
    }
    .placard-dot {
      position: absolute;
      left: -3px;
      top: -3px;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--placard-accent);
      box-shadow: 0 0 10px var(--placard-accent);
      opacity: 0;
      transition: opacity 0.45s ease;
    }
    #placard.open .placard-line { opacity: 0.65; }
    #placard.open .placard-dot { opacity: 1; }
    /* Out of view for now: fade, and come back when looked at again */
    #placard.open.away .placard-panel, #placard.open.away .placard-line, #placard.open.away .placard-dot { opacity: 0; }
    #placard.instant .placard-panel, #placard.instant .placard-line, #placard.instant .placard-dot { transition: none; }
    #placard.docked .placard-panel {
      top: auto;
      bottom: 16px;
      left: 16px;
      width: calc(100vw - 32px);
      max-height: 45vh;
      overflow: auto;
      transform: none !important;
    }
    #placard.docked .placard-line, #placard.docked .placard-dot { display: none; }

    /* ---- Stepping between worlds ---- */
    #transition {
      position: fixed;
      inset: 0;
      z-index: 8;
      display: grid;
      place-items: center;
      pointer-events: none;
      opacity: 0;
      background: #000;
      background: radial-gradient(circle at 50% 50%, color-mix(in srgb, var(--tint, #9fe8ff) 32%, black) 0%, #000 62%);
      transition: opacity var(--in, 1s) ease;
    }
    #transition.active { opacity: 1; transition: opacity var(--out, 0.75s) cubic-bezier(0.55, 0, 0.75, 0.4); }
    .transition-card { display: flex; flex-direction: column; align-items: center; gap: 12px; opacity: 0; transform: translateY(8px); transition: opacity 0.5s ease, transform 0.9s cubic-bezier(0.22, 1, 0.36, 1); }
    #transition.active .transition-card { opacity: 1; transform: none; transition-delay: 0.35s; }
    #transition.leaving .transition-card { opacity: 0; transition-duration: 0.3s; transition-delay: 0s; }
    .transition-label { margin: 0; font-size: 11px; letter-spacing: 0.5em; padding-left: 0.5em; text-transform: uppercase; color: var(--tint, #9fe8ff); }
    .transition-title { margin: 0; font-weight: 200; font-size: clamp(26px, 4vw, 42px); letter-spacing: 0.3em; padding-left: 0.3em; text-transform: uppercase; color: #f4f9ff; }
    .transition-tagline { margin: 0; font-family: var(--serif); font-style: italic; font-size: 16px; color: rgba(220, 232, 245, 0.7); }

    @media (max-width: 640px) {
      #story { left: 16px; right: 16px; max-width: none; font-size: 15px; }
    }
    @media (prefers-reduced-motion: reduce) {
      #story, .transition-card { transform: none; filter: none; }
      .entrance-action { animation: none; }
    }
  </style>
</head>
<body>
<div id="entrance">
  <div class="entrance-inner">
    <div class="entrance-rule"></div>
    <p class="entrance-kicker"><span class="when-unpaused">Welcome to the</span><span class="when-paused">Your visit is paused</span></p>
    <h1 class="entrance-title">Virtual Anime Museum</h1>
    <p class="entrance-tagline">Worlds you can walk into</p>
    <div class="entrance-action">
      <span class="when-loading">Opening the museum…</span><span class="when-ready">Click to enter</span><span class="when-paused">Click to continue</span>
    </div>
    <p class="entrance-controls"><b>WASD</b> walk · <b>Shift</b> hurry · <b>Space</b> jump · <b>E</b> examine · <b>Esc</b> pause</p>
    <label class="settings" for="volume-slider">Volume <input type="range" id="volume-slider" min="0" max="1" step="0.05" value="0.7"></label>
    <p class="entrance-note">Best with headphones</p>
  </div>
</div>
<div id="crosshair" aria-hidden="true"></div>
<div id="interaction-prompt"><span class="key">E</span><span class="label"></span></div>
<div id="story" aria-live="polite"></div>
<aside id="placard" aria-live="polite">
  <div class="placard-line"></div>
  <div class="placard-dot"></div>
  <div class="placard-panel">
    <p class="placard-label"></p>
    <h2 class="placard-title"></h2>
    <p class="placard-meta"></p>
    <div class="placard-body"></div>
    <ol class="placard-entries"></ol>
    <p class="placard-footer"></p>
  </div>
</aside>
<div id="transition" aria-hidden="true">
  <div class="transition-card">
    <p class="transition-label"></p>
    <h2 class="transition-title"></h2>
    <p class="transition-tagline"></p>
  </div>
</div>
<script type="module" src="./src/main.js"></script>
</body>
</html>
